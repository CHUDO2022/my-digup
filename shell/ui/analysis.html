<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Анализ фото</title>
  <link rel="stylesheet" href="analysis.css">
</head>
<body>
  <header class="top">
    <button class="back" id="back" hidden aria-label="Назад" title="Назад (Esc)">
      <svg viewBox="0 0 16 16"><path d="M10 3.5 L5.5 8 L10 12.5"/></svg>
    </button>
    <h1 id="title">Анализ фото</h1>
    <button class="rename" id="rename" hidden title="Переименовать группу">✎</button>
    <span class="spacer"></span>
    <label class="folder" id="folder-box">
      <span>Папка:</span>
      <select id="folder"></select>
    </label>
    <button class="primary" id="run">Анализировать</button>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="groups" class="selected">Что на фото</button>
    <button data-tab="junk">Мусор</button>
    <button data-tab="quarantine">Карантин и перемещённые</button>
  </nav>

  <div class="progress" id="progress" hidden>
    <span class="ring" id="ring"></span>
    <span id="progress-text"></span>
    <span class="bar"><span id="progress-bar"></span></span>
  </div>

  <main id="main"></main>

  <footer class="actions" id="actions" hidden>
    <span id="selected-text"></span>
    <span class="spacer"></span>
    <button id="select-all">Выбрать всё</button>
    <button id="select-none">Снять выбор</button>
    <button id="move">Переместить в папку…</button>
    <button class="danger" id="quarantine">В карантин</button>
  </footer>

  <div class="toast" id="toast" hidden></div>

  <script src="analysis.js"></script>
</body>
</html>
